name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://skillbridge:ci@localhost:5432/skillbridge
  AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_testsecret_0123456789
  SEED_DEV_USERS: "1"
  SEED_DEV_PASSWORD: dev-reviewer-pass
  AUTH_TRUST_HOST: "true"
  EMAIL_OUTBOX: "1"
  UPLOAD_DIR: .uploads
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: skillbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillbridge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design gate (no generated-UI tells)
        run: npm run design-lint
      - name: Database schema and catalog
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
      - name: Build
        run: npm run build
      - name: Browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ > /dev/null
      - name: End-to-end tests
        run: BASE_URL=http://localhost:3000 npm run test:e2e
      - name: Server log on failure
        if: failure()
        run: tail -100 server.log
